name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      INFISICAL_DOMAIN: https://infisical.sperium.net
      INFISICAL_PROJECT_ID: eeef02f2-9543-4475-9e9b-007996bee0ef
      IMAGE_NAME: forgejo.sperium.net/duddy57/thiago-lp-astro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf \
            'https://artifacts-cli.infisical.com/setup.deb.sh' \
            | sudo -E bash

          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Authenticate with Infisical
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          INFISICAL_TOKEN="$(
            infisical login \
              --domain="$INFISICAL_DOMAIN" \
              --method=universal-auth \
              --client-id="$INFISICAL_CLIENT_ID" \
              --client-secret="$INFISICAL_CLIENT_SECRET" \
              --silent \
              --plain
          )"

          echo "::add-mask::$INFISICAL_TOKEN"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Buildx
        run: docker buildx inspect --bootstrap

      - name: Build and push multiarch image
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::12}"
          export SHORT_SHA IMAGE_NAME

          infisical run \
            --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env=prod \
            --path=/ \
            -- sh -euc '
              printf "%s" "$REGISTRY_TOKEN" |
                docker login forgejo.sperium.net \
                  --username "$REGISTRY_USER" \
                  --password-stdin

              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                --tag "$IMAGE_NAME:latest" \
                --tag "$IMAGE_NAME:$SHORT_SHA" \
                --push \
                .

              docker logout forgejo.sperium.net
            '
