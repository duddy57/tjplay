
services:
  landing-page:
    image: forgejo.sperium.net/duddy57/thiago-lp-astro:latest
    restart: unless-stopped
    networks:
      - public
    labels:
      traefik.enable: "true"
      traefik.docker.network: network_public_attachable

      traefik.http.routers.thiago-lp.rule: "Host(`${TJPLAY_DOMAIN}`)"
      traefik.http.routers.thiago-lp.entrypoints: websecure
      traefik.http.routers.thiago-lp.tls: "true"
      traefik.http.routers.thiago-lp.tls.certresolver: letsencryptresolver

      traefik.http.services.thiago-lp.loadbalancer.server.port: "80"

networks:
  public:
    external: true
    name: network_public_attachable

